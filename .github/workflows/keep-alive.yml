name: Keep Render backend alive

# Render's free web-service tier spins down after ~15 minutes of no traffic,
# causing a slow cold start on the next real request. This pings /health
# often enough that it never goes idle. Set the BACKEND_URL repo variable
# (Settings -> Secrets and variables -> Actions -> Variables) to your Render
# service URL, e.g. https://tiss-backend.onrender.com, once it's deployed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repo variable not set yet — skipping."
            exit 0
          fi
          curl -sf "${{ vars.BACKEND_URL }}/health" || echo "Ping failed (backend may be cold-starting)."
